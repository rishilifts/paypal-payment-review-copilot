<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Review Copilot</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="mockbar" class="mockbar hidden"></div>
<header class="wrap">
  <div class="brand">
    <svg class="cat" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#1f2a44" d="M14 18 L16.5 5 L23.5 14.5 Z"/>
      <path fill="#1f2a44" d="M34 18 L31.5 5 L24.5 14.5 Z"/>
      <circle cx="24" cy="20" r="9.5" fill="#1f2a44"/>
      <path fill="#1f2a44" d="M14.5 45 C14.5 33.5 18.5 28.5 24 28.5 C29.5 28.5 33.5 33.5 33.5 45 Z"/>
      <path class="tail" d="M33.5 41 C40.5 41 42.5 34.5 40.5 29" stroke="#1f2a44" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <g class="eyes">
        <circle cx="20.3" cy="19" r="1.3" fill="#fff"/>
        <circle cx="27.7" cy="19" r="1.3" fill="#fff"/>
      </g>
    </svg>
    <span class="wordmark">Payment Review Copilot</span>
  </div>
  <p id="baseline" class="baseline"></p>
  <details id="settings" class="settings">
    <summary>Review settings</summary>
    <form id="settingsform">
      <label>Markets you sell to <span class="hint">2-letter country codes, comma separated</span>
        <input id="f-markets" type="text" placeholder="US, IN">
      </label>
      <label>Typical order up to <span class="hint">in your currency</span>
        <input id="f-max" type="number" min="1" step="1" placeholder="500">
      </label>
      <button type="submit">Save settings</button>
      <span id="settingsmsg" class="hint"></span>
    </form>
  </details>
</header>
<main class="wrap">
  <section id="list"></section>
  <footer class="fineprint">Flags come from your review settings and the payment details. This app never holds, blocks, approves or moves money - the decision is always yours.</footer>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
